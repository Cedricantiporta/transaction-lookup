<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Moodboard</title>
<meta name="description" content="A minimalist moodboard for collecting and organizing images.">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%2242%22 height=%2242%22 x=%228%22 y=%228%22 rx=%2210%22 fill=%22%23111%22/><rect width=%2242%22 height=%2242%22 x=%2250%22 y=%228%22 rx=%2210%22 fill=%22%23bbb%22/><rect width=%2242%22 height=%2242%22 x=%228%22 y=%2250%22 rx=%2210%22 fill=%22%23bbb%22/><rect width=%2242%22 height=%2242%22 x=%2250%22 y=%2250%22 rx=%2210%22 fill=%22%23111%22/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="2" width="9" height="9" rx="2.4" fill="currentColor" opacity=".92"/><rect x="13" y="2" width="9" height="9" rx="2.4" fill="currentColor" opacity=".45"/><rect x="2" y="13" width="9" height="9" rx="2.4" fill="currentColor" opacity=".45"/><rect x="13" y="13" width="9" height="9" rx="2.4" fill="currentColor" opacity=".92"/></svg>
        </span>
        <span class="brand-name">Moodboard</span>
      </div>
      <button class="icon-btn sidebar-collapse-btn" id="collapseSidebarBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 4v16M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <nav class="board-list" id="boardList" aria-label="Moodboard projects"></nav>

    <button class="new-board-btn" id="newBoardBtn">
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New Moodboard
    </button>

    <div class="sidebar-divider"></div>

    <button class="bin-btn" id="binBtn" data-board="__bin__">
      <span class="bin-btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="bin-btn-label">Bin</span>
      <span class="bin-count" id="binCount" hidden>0</span>
    </button>

    <div class="sidebar-footer">
      <div class="shared-note">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 8.6 9 10 5.2-1.4 9-5 9-10V6l-9-4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Saved on this device only
      </div>
    </div>
  </aside>

  <button class="icon-btn sidebar-expand-btn" id="expandSidebarBtn" title="Show sidebar" aria-label="Show sidebar" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm5 0v16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title-wrap">
        <h1 class="board-title" id="boardTitle" contenteditable="false" spellcheck="false"></h1>
        <p class="board-subtitle" id="boardSubtitle"></p>
      </div>

      <div class="topbar-actions">
        <div class="search-field">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="searchInput" placeholder="Search this moodboard" autocomplete="off">
        </div>
        <div class="view-toggle" id="viewToggle" role="group" aria-label="Layout">
          <button class="view-toggle-btn active" data-view="masonry" title="Masonry view" aria-label="Masonry view">
            <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="3" width="8" height="11" rx="1.6" fill="currentColor"/><rect x="13" y="3" width="8" height="6" rx="1.6" fill="currentColor" opacity=".5"/><rect x="13" y="11" width="8" height="10" rx="1.6" fill="currentColor" opacity=".5"/><rect x="3" y="16" width="8" height="5" rx="1.6" fill="currentColor" opacity=".5"/></svg>
          </button>
          <button class="view-toggle-btn" data-view="grid" title="Grid view" aria-label="Grid view">
            <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="3" width="8" height="8" rx="1.6" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="1.6" fill="currentColor" opacity=".5"/><rect x="3" y="13" width="8" height="8" rx="1.6" fill="currentColor" opacity=".5"/><rect x="13" y="13" width="8" height="8" rx="1.6" fill="currentColor" opacity=".5"/></svg>
          </button>
        </div>
        <button class="primary-btn" id="uploadBtn">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 16V4m0 0 5 5m-5-5-5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Add Images
        </button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
    </header>

    <div class="category-bar" id="categoryBar" role="tablist" aria-label="Categories"></div>

    <div class="board-scroll" id="boardScroll">
      <div class="dropzone-overlay" id="dropOverlay">
        <div class="dropzone-card">
          <svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 16V4m0 0 5 5m-5-5-5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p>Drop to add to <strong id="dropTargetName">this moodboard</strong></p>
        </div>
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-illustration" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40"><rect x="3" y="3" width="18" height="18" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8.5" cy="8.5" r="1.7" fill="currentColor"/><path d="m3 16 5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </div>
        <h2 id="emptyTitle">Nothing here yet</h2>
        <p id="emptySubtitle">Drag images in, or click Add Images to start this moodboard.</p>
      </div>

      <div class="masonry" id="masonry"></div>
    </div>
  </main>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <figure class="lightbox-figure">
    <img id="lightboxImage" alt="">
  </figure>

  <div class="lightbox-panel">
    <div class="lightbox-panel-main">
      <input type="text" id="lightboxName" class="lightbox-name-input" spellcheck="false">
      <div class="lightbox-meta" id="lightboxMeta"></div>
      <div class="lightbox-category-row">
        <label for="lightboxCategorySelect">Category</label>
        <select id="lightboxCategorySelect"></select>
      </div>
    </div>
    <div class="lightbox-panel-actions">
      <button class="ghost-btn" id="lightboxDownload">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download
      </button>
      <button class="ghost-btn danger" id="lightboxBin">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Move to Bin
      </button>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="context-menu" id="contextMenu" hidden></div>

<!-- Toast -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<!-- Confirm dialog -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="ghost-btn" id="modalCancel">Cancel</button>
      <button class="primary-btn danger" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
